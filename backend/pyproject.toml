[project]
name = "ai-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.6",
  "psycopg[binary,pool]==3.3.6",
  "redis==7.4.1",
  "langchain==1.4.7",
  "langchain-core==1.7.3",
  "langchain-openai==1.7.3",
  "langgraph==1.2.19",
  "langgraph-checkpoint==4.3.1",
  "langgraph-checkpoint-postgres==3.2.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "argon2-cffi==25.1.0",
  "pyotp==2.10.0",
]

[project.scripts]
ai-platform = "ai_platform.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.uv.build-backend]
source-exclude = [".venv-*", ".t01-pg"]
